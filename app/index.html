<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>expertdial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f6feb%22/></svg>">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #263040; --text: #e6edf3; --dim: #8b949e;
    --heat: #1f6feb; --flash: #e6edf3; --ban: #f85149; --force: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
           align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.2fr); gap: 20px; padding: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
              margin: 0 0 12px; font-weight: 600; }
  textarea { width: 100%; background: #0d1117; color: var(--text); border: 1px solid var(--line);
             border-radius: 8px; padding: 10px; font: inherit; resize: vertical; min-height: 68px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 7px;
           padding: 7px 13px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3d4c63; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--heat); border-color: var(--heat); }
  #output { white-space: pre-wrap; margin-top: 14px; min-height: 120px; line-height: 1.55;
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .grid { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; }
  .layer { display: flex; gap: 2px; align-items: center; }
  .layer .label { width: 30px; flex: none; color: var(--dim); font: 10px ui-monospace, monospace; }
  .cell { width: 11px; height: 11px; flex: none; border-radius: 2px; background: #1b2230;
          cursor: pointer; transition: background .25s ease; }
  .cell.lit { background: var(--flash); transition: none; }
  .cell.ban { box-shadow: inset 0 0 0 2px var(--ban); }
  .cell.force { box-shadow: inset 0 0 0 2px var(--force); }
  .legend { display: flex; gap: 16px; color: var(--dim); font-size: 12px; margin-top: 14px; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  #status { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>expertdial</h1>
  <span class="meta" id="model">connecting…</span>
  <span class="meta" id="speed"></span>
  <span class="meta" id="status"></span>
</header>

<main>
  <section class="panel">
    <h2>Prompt</h2>
    <textarea id="prompt" placeholder="Ask something…">Name three colors and say why you like them.</textarea>
    <div class="row">
      <button class="primary" id="send" disabled>Send</button>
      <label class="meta">tokens
        <input id="npredict" type="number" value="96" min="8" max="512"
               style="width:64px;background:#0d1117;color:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px;">
      </label>
    </div>
    <div id="output"></div>
  </section>

  <section class="panel">
    <h2>Experts <span id="dims" class="meta"></span></h2>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="swatch" style="background:#1f6feb"></i>routed often</span>
      <span><i class="swatch" style="background:#e6edf3"></i>routed by this token</span>
      <span><i class="swatch" style="box-shadow:inset 0 0 0 2px #f85149"></i>banned</span>
      <span><i class="swatch" style="box-shadow:inset 0 0 0 2px #3fb950"></i>forced on</span>
      <button id="clear">Clear steering</button>
    </div>
    <p class="note">Click an expert to cycle: normal → banned → forced on. Changes apply to the next token,
      mid-answer. Banning is safe; forcing many experts at once degrades the model badly.</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let nLayer = 0, nExpert = 0, cells = [], heat = [], steering = new Map();

function key(l, e) { return l + ":" + e; }

function buildGrid(layers, experts) {
  nLayer = layers; nExpert = experts;
  heat = Array.from({length: layers}, () => new Array(experts).fill(0));
  cells = [];
  const grid = $("grid");
  grid.innerHTML = "";
  for (let l = 0; l < layers; l++) {
    const row = document.createElement("div");
    row.className = "layer";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "L" + l;
    row.appendChild(label);
    cells[l] = [];
    for (let e = 0; e < experts; e++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.title = `layer ${l}, expert ${e}`;
      cell.onclick = () => cycle(l, e);
      row.appendChild(cell);
      cells[l][e] = cell;
    }
    grid.appendChild(row);
  }
  $("dims").textContent = `${layers} layers × ${experts}`;
}

async function cycle(l, e) {
  const current = steering.get(key(l, e));
  const next = current === undefined ? "ban" : current === "ban" ? "force" : null;
  await fetch("/steer", {method: "POST", headers: {"Content-Type": "application/json"},
                         body: JSON.stringify({layer: l, expert: e, state: next})});
}

function applySteering(list) {
  steering = new Map(list.map(([l, e, s]) => [key(l, e), s]));
  for (let l = 0; l < nLayer; l++) {
    for (let e = 0; e < nExpert; e++) {
      const state = steering.get(key(l, e));
      cells[l][e].classList.toggle("ban", state === "ban");
      cells[l][e].classList.toggle("force", state === "force");
    }
  }
}

function paintHeat() {
  // normalise per layer: every layer routes the same number of experts per token,
  // so a global max would wash out layers whose usage is spread evenly
  for (let l = 0; l < nLayer; l++) {
    const max = Math.max(1, ...heat[l]);
    for (let e = 0; e < nExpert; e++) {
      const v = Math.pow(heat[l][e] / max, 0.6);  // gamma: make light usage visible
      cells[l][e].style.background = heat[l][e] === 0 ? "" : `rgba(31,111,235,${(0.12 + 0.88 * v).toFixed(3)})`;
    }
  }
}

function flash(routes) {
  for (const [l, experts] of Object.entries(routes)) {
    for (const e of experts) {
      const cell = cells[l]?.[e];
      if (!cell) continue;
      heat[l][e]++;
      cell.classList.add("lit");
      setTimeout(() => cell.classList.remove("lit"), 220);
    }
  }
}

const events = new EventSource("/events");
events.onmessage = (event) => {
  const message = JSON.parse(event.data);
  if (message.type === "ready") {
    $("model").textContent = `${message.model || message.arch} · ${message.n_expert_used} of ${message.n_expert} experts per token`;
    $("send").disabled = false;
    if (message.n_layer !== nLayer || message.n_expert !== nExpert) buildGrid(message.n_layer, message.n_expert);
    fetch("/state").then(r => r.json()).then(s => applySteering(s.steering));
  } else if (message.type === "prefill") {
    for (const [l, counts] of Object.entries(message.counts)) {
      counts.forEach((c, e) => { if (heat[l]) heat[l][e] += c; });
    }
    paintHeat();
    $("status").textContent = `prompt: ${message.n_prompt_tokens} tokens`;
  } else if (message.type === "token") {
    $("output").textContent += message.text;
    flash(message.routes);
  } else if (message.type === "done") {
    paintHeat();
    $("send").disabled = false;
    const rate = message.ms > 0 ? (message.n_tokens / (message.ms / 1000)).toFixed(1) : "–";
    $("speed").textContent = `${message.n_tokens} tokens · ${rate} tok/s`;
    $("status").textContent = "";
  } else if (message.type === "steering") {
    applySteering(message.steering);
  } else if (message.type === "error") {
    $("status").textContent = "error: " + message.message;
    $("send").disabled = false;
  }
};

$("send").onclick = () => {
  $("output").textContent = "";
  $("send").disabled = true;
  $("status").textContent = "thinking…";
  fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                  body: JSON.stringify({prompt: $("prompt").value, n_predict: Number($("npredict").value)})});
};

$("clear").onclick = () => fetch("/steer", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({clear: true})});

$("prompt").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("send").click();
});
</script>
</body>
</html>
